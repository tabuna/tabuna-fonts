<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пробелы — Tabuna Sans</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Ширина обычного и неразрывного пробела</h1>
<p>Калибровочная сетка и отдельные промежуточные значения. Белый растр пробела не считается проверкой рисунка букв.</p>
<p id="status">Измерение…</p>
<details><summary>Сводка JSON</summary><pre id="summary"></pre></details>
<details><summary>Полные измерения JSON</summary><pre id="json"></pre></details>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),baseline=params.has('baseline'),candidate=params.has('candidate'),holdout=params.has('holdout');
  const base='references/space-widths-baseline/';
  const grid=holdout?{weights:[150,250,350,450,550,650,750,850],sizes:[10.5,13.5,17.5,21,23,25,27,36,80]}:await(await fetch(base+'grid.json',{cache:'no-store'})).json();
  const worker=new Worker('scripts/canvas-worker.js');
  worker.onmessage=({data})=>{
    worker.terminate();if(data.error){document.querySelector('#status').textContent=data.error;return}
    const stats=rs=>({total:rs.length,exactAdvance:rs.filter(r=>r.exactAdvance).length,meanAbsoluteWidthError:rs.reduce((a,r)=>a+Math.abs(r.ownAdvance-r.systemAdvance),0)/rs.length,maxAbsoluteWidthError:Math.max(...rs.map(r=>Math.abs(r.ownAdvance-r.systemAdvance))),selfTestPixels:rs.reduce((a,r)=>a+r.selfTestPixels,0)});
    const summary={baseline,candidate,holdout,fontHash:data.fontHash,userAgent:data.userAgent,...stats(data.records),
      byWeight:grid.weights.map(weight=>({weight,...stats(data.records.filter(r=>r.weight===weight))})),
      misses:data.records.filter(r=>!r.exactAdvance).map(r=>[r.text,r.weight,r.size,r.ownAdvance,r.systemAdvance])};
    document.querySelector('#json').textContent=JSON.stringify(data,null,2);
    document.querySelector('#summary').textContent=JSON.stringify(summary,null,2);
    document.querySelector('#status').textContent=`Ширины: ${summary.exactAdvance}/${summary.total}.`;
  };
  worker.onerror=e=>{worker.terminate();document.querySelector('#status').textContent=e.message};
  const path=baseline?base+'TabunaSans-before.woff2':candidate?'build/space-widths-candidate.woff2':'dist/TabunaSansVariable.woff2';
  worker.postMessage({fontURL:new URL(path+`?v=${Date.now()}`,location.href).href,characters:[' ','\u00a0'],...grid});
})().catch(e=>document.querySelector('#status').textContent=e.message);
</script>
</html>
