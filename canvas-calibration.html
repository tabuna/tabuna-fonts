<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Диагностика оптики Canvas — Tabuna Sans</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;margin:32px}pre{white-space:pre-wrap}#samples{position:absolute;visibility:hidden;pointer-events:none}</style>
<h1>Диагностика оптики Canvas</h1>
<p id="status">Загрузка шрифта…</p>
<details><summary>Измерения JSON</summary><pre id="json"></pre></details>
<h2>Canvas в отдельном потоке</h2>
<p id="worker-status">Ожидание проверки…</p>
<details><summary>Измерения Worker JSON</summary><pre id="worker-json"></pre></details>
<div id="samples" aria-hidden="true"></div>
<script>
(async()=>{
  const response=await fetch(`dist/TabunaSansVariable.woff2?v=${Date.now()}`,{cache:'no-store'});
  if(!response.ok)throw new Error(`Ошибка загрузки: ${response.status}`);
  const bytes=await response.arrayBuffer();
  const fontHash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
  const face=new FontFace('TabunaCanvasProbe',bytes,{weight:'100 900'});
  await face.load();document.fonts.add(face);
  const records=[];
  const query=new URLSearchParams(location.search);
  const canvasFirst=query.get('phase')==='canvas-first';
  const sizes=[12,14,16,18,20,24,28,32,48,64,96,128];
  if(query.get('order')==='descending')sizes.reverse();
  for(const family of ['TabunaCanvasProbe','system-ui']){
    for(const size of sizes){
      const span=document.createElement('span');span.style.cssText=`font:400 ${size}px ${family};font-optical-sizing:auto;white-space:pre`;span.textContent='I';
      if(!canvasFirst)document.querySelector('#samples').append(span);
      const range=document.createRange();range.selectNodeContents(span);
      const dom=canvasFirst?null:range.getBoundingClientRect().width;
      for(const mode of (canvasFirst?['detached','scaled']:['detached','attached','attached-none','scaled'])){
        const canvas=document.createElement('canvas');canvas.width=640;canvas.height=400;
        const scale=mode==='scaled'?devicePixelRatio:1;
        if(mode.startsWith('attached')){
          canvas.style.fontOpticalSizing=mode==='attached-none'?'none':'auto';
          canvas.style.fontSize=`${size}px`;document.querySelector('#samples').append(canvas);
        }
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.scale(scale,scale);ctx.font=`400 ${size}px ${family}`;ctx.fontKerning='normal';
        ctx.fillStyle='#fff';ctx.fillRect(0,0,640,400);ctx.fillStyle='#000';
        const before=ctx.measureText('I').width;ctx.fillText('I',32,160);const after=ctx.measureText('I').width;
        const data=ctx.getImageData(0,0,640,400).data;let left=640,right=-1,top=400,bottom=-1;
        for(let y=0;y<400;y++)for(let x=0;x<640;x++)if(data[(y*640+x)*4]<128){left=Math.min(left,x);right=Math.max(right,x);top=Math.min(top,y);bottom=Math.max(bottom,y)}
        records.push({family,size,mode,scale,dom,before,after,font:ctx.font,inkBox:[left,right,top,bottom]});
      }
    }
  }
  const result={userAgent:navigator.userAgent,devicePixelRatio,fontHash,phase:canvasFirst?'canvas-first':'dom-first',order:query.get('order')||'ascending',records};
  document.querySelector('#json').textContent=JSON.stringify(result,null,2);
  document.querySelector('#status').textContent=`Завершено ${records.length} измерений.`;
  const worker=new Worker('scripts/canvas-worker.js');
  worker.onmessage=({data})=>{
    document.querySelector('#worker-json').textContent=JSON.stringify(data,null,2);
    document.querySelector('#worker-status').textContent=data.error||`Пиксели: ${data.exactPixelCount}/${data.records.length}; ширины: ${data.exactAdvanceCount}; пиксели и ширины: ${data.completeCount}.`;
    worker.terminate();
  };
  worker.onerror=event=>{document.querySelector('#worker-status').textContent=event.message;worker.terminate()};
  worker.postMessage({fontURL:new URL(`dist/TabunaSansVariable.woff2?v=${Date.now()}`,location.href).href,
    characters:['I','H','E','F','L','Н','Е','І','P','Р','D','B','В','в'],sizes:[16,32,64,128]});
})().catch(e=>document.querySelector('#status').textContent=e.message);
</script>
</html>
