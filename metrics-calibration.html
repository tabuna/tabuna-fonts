<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пропорции алфавита — Tabuna Sans</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;margin:32px}pre{white-space:pre-wrap}</style>
<h1>Пропорции алфавита и цифр</h1>
<p id="status">Загрузка…</p>
<details><summary>Измерения JSON</summary><pre id="json"></pre></details>
<script>
(async()=>{
  const baseline=new URLSearchParams(location.search).has('baseline');
  const response=await fetch('proofs/weight-metrics/characters.json',{cache:'no-store'});
  if(!response.ok)throw new Error(`Набор символов: HTTP ${response.status}`);
  const set=await response.json();
  const worker=new Worker('scripts/canvas-worker.js');
  worker.onmessage=({data})=>{
    data.baseline=baseline;data.calibratedCharacters=set.calibrated;data.controlCharacters=set.controls;
    document.querySelector('#json').textContent=JSON.stringify(data,null,2);
    document.querySelector('#status').textContent=data.error||`Ширины: ${data.exactAdvanceCount}/${data.records.length}; пиксели вместе с шириной: ${data.completeCount}.`;
    worker.terminate();
  };
  worker.onerror=event=>{document.querySelector('#status').textContent=event.message;worker.terminate()};
  worker.postMessage({fontURL:new URL((baseline?'references/weight-metrics-baseline/TabunaSans-before.woff2':'dist/TabunaSansVariable.woff2')+`?v=${Date.now()}`,location.href).href,
    characters:[...set.characters],sizes:[16,32,64,128],weights:[100,400,900]});
})().catch(error=>{document.querySelector('#status').textContent=error.message});
</script>
</html>
