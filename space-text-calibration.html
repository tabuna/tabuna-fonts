<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Интервалы в строках — Tabuna Sans</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere}#samples{position:absolute;visibility:hidden;left:0;top:0}.measure{display:inline-block;white-space:pre;font-optical-sizing:auto;font-kerning:normal;letter-spacing:normal}</style>
<h1>Изменение ширины целых строк</h1>
<p id="status">Измерение…</p>
<details><summary>Сводка JSON</summary><pre id="summary"></pre></details>
<details><summary>Полные измерения JSON</summary><pre id="json"></pre></details>
<div id="samples" aria-hidden="true"></div>
<script>
(async()=>{
  const candidate=new URLSearchParams(location.search).has('candidate'),hashes={};
  for(const [family,path] of [['TabunaBefore','references/space-widths-baseline/TabunaSans-before.woff2'],['TabunaAfter',candidate?'build/space-widths-candidate.woff2':'dist/TabunaSansVariable.woff2']]){
    const response=await fetch(path+`?v=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw Error(`Font HTTP ${response.status}`);
    const bytes=await response.arrayBuffer();hashes[family]=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
    const face=new FontFace(family,bytes,{weight:'100 900'});await face.load();document.fonts.add(face);
  }
  const {strings}=await(await fetch('sources/text-validation.json',{cache:'no-store'})).json();
  const records=[],weights=[100,200,300,400,500,600,700,800,900];
  for(const weight of weights)for(const size of [9,12,14,16,18,20,24,28,32,48,64,96,128])for(const text of [...strings,'I I','I\u00a0I']){
    const row={weight,size,text};
    for(const [key,family] of [['before','TabunaBefore'],['after','TabunaAfter'],['system','system-ui']]){
      const el=document.createElement('span');el.className='measure';el.style.fontFamily=family;el.style.fontSize=`${size}px`;el.style.fontWeight=weight;el.textContent=text;
      document.querySelector('#samples').append(el);const range=document.createRange();range.selectNodeContents(el);row[key]=range.getBoundingClientRect().width;el.remove();
    }
    records.push(row);
  }
  const stats=rs=>({total:rs.length,beforeExact:rs.filter(r=>r.before===r.system).length,afterExact:rs.filter(r=>r.after===r.system).length,
    improved:rs.filter(r=>Math.abs(r.after-r.system)<Math.abs(r.before-r.system)).length,regressed:rs.filter(r=>Math.abs(r.after-r.system)>Math.abs(r.before-r.system)).length,
    beforeMeanAbsoluteWidthError:rs.reduce((a,r)=>a+Math.abs(r.before-r.system),0)/rs.length,afterMeanAbsoluteWidthError:rs.reduce((a,r)=>a+Math.abs(r.after-r.system),0)/rs.length});
  const summary={hashes,userAgent:navigator.userAgent,devicePixelRatio,...stats(records),byWeight:weights.map(weight=>({weight,...stats(records.filter(r=>r.weight===weight))})),
    unspacedChanged:records.filter(r=>!/[ \u00a0]/u.test(r.text)&&r.before!==r.after),exactLost:records.filter(r=>r.before===r.system&&r.after!==r.system)};
  document.querySelector('#json').textContent=JSON.stringify({hashes,records},null,2);document.querySelector('#summary').textContent=JSON.stringify(summary,null,2);
  document.querySelector('#status').textContent=`Точные строки: ${summary.beforeExact} → ${summary.afterExact} из ${summary.total}.`;
})().catch(e=>document.querySelector('#status').textContent=e.message);
</script>
</html>
