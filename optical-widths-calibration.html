<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оптические ширины — Tabuna Sans</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Ширины на промежуточных оптических размерах</h1>
<p id="status">Измерение…</p>
<details><summary>Сводка JSON</summary><pre id="summary"></pre></details>
<details><summary>Полные измерения JSON</summary><pre id="json"></pre></details>
<script>
(async()=>{
  const params=new URLSearchParams(location.search),baseline=params.has('baseline'),candidate=params.has('candidate');
  const base='references/optical-widths-baseline/';
  const set=await (await fetch(base+'eligible.json',{cache:'no-store'})).json();
  const native=await Promise.all([100,400,900].flatMap(w=>[18,20,24].map(s=>fetch(base+`characters-${w}-${s}.json`,{cache:'no-store'}).then(r=>r.json()))));
  const worker=new Worker('scripts/canvas-worker.js');
  worker.onmessage=({data})=>{
    worker.terminate();if(data.error){document.querySelector('#status').textContent=data.error;return}
    const stats=rs=>({total:rs.length,exactAdvance:rs.filter(r=>r.exactAdvance).length,complete:rs.filter(r=>r.completeMatch).length,
      absoluteInkError:rs.reduce((a,r)=>a+r.absoluteInkError,0),selfTestPixels:rs.reduce((a,r)=>a+r.selfTestPixels,0),
      referenceMatchesRoundedNative:rs.filter(r=>r.systemAdvance===Math.round(native.find(n=>n.weight===r.weight&&n.pointSize===r.size).records.find(n=>n.text===r.text).system*2048/r.size)*r.size/2048).length});
    const summary={baseline,candidate,fontHash:data.fontHash,userAgent:data.userAgent,...stats(data.records),
      byLocation:[100,400,900].flatMap(weight=>[18,20,24].map(size=>({weight,size,...stats(data.records.filter(r=>r.weight===weight&&r.size===size))}))),
      misses:data.records.filter(r=>!r.exactAdvance).map(r=>[r.text,r.weight,r.size,r.ownAdvance,r.systemAdvance])};
    document.querySelector('#json').textContent=JSON.stringify(data,null,2);
    document.querySelector('#summary').textContent=JSON.stringify(summary,null,2);
    document.querySelector('#status').textContent=`Ширины: ${summary.exactAdvance}/${summary.total}; полные совпадения: ${summary.complete}.`;
  };
  worker.onerror=e=>{worker.terminate();document.querySelector('#status').textContent=e.message};
  const path=baseline?base+'TabunaSans-before.woff2':candidate?'build/optical-widths-candidate.woff2':'dist/TabunaSansVariable.woff2';
  worker.postMessage({fontURL:new URL(path+`?v=${Date.now()}`,location.href).href,characters:set.characters,weights:[100,400,900],sizes:[18,20,24]});
})().catch(e=>document.querySelector('#status').textContent=e.message);
</script>
</html>
