<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка U/u и их производных — Tabuna Sans</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Парное сравнение U/u и их производных</h1>
<p id="status">Измерение…</p>
<p>Два независимых Worker: прежняя и текущая сборки, один системный эталон.</p>
<details><summary>Сводка JSON</summary><pre id="summary"></pre></details>
<details><summary>Полные измерения JSON</summary><pre id="json"></pre></details>
<script>
(async()=>{
  const holdout=new URLSearchParams(location.search).has('holdout');
  const characters=(await(await fetch('references/u-bowls-baseline/validation.json',{cache:'no-store'})).json()).strings;
  const selected=holdout?[...'UuÙÚÛÜùúûüŨũŪūŬŭŮůŰűŲų']:characters;
  const weights=holdout?[200,300,500,600,700,800]:[100,400,900],sizes=holdout?[14,20,24,48,96]:[16,32,64,128];
  const run=path=>new Promise((resolve,reject)=>{
    const worker=new Worker('scripts/canvas-worker.js');
    worker.onmessage=({data})=>{worker.terminate();data.error?reject(new Error(data.error)):resolve(data)};
    worker.onerror=e=>{worker.terminate();reject(new Error(e.message))};
    worker.postMessage({fontURL:new URL(`${path}?v=${Date.now()}`,location.href).href,characters:selected,sizes,weights,hashPixels:true});
  });
  const before=await run('references/u-bowls-baseline/TabunaSans-before.woff2');
  const after=await run('dist/TabunaSansVariable.woff2');
  if(before.records.length!==after.records.length)throw new Error('Разные наборы сравнений');
  const rows=after.records.map((r,i)=>{
    const b=before.records[i];
    if(r.text!==b.text||r.size!==b.size||r.weight!==b.weight)throw new Error('Разный порядок сравнений');
    return {...r,beforeInkError:b.absoluteInkError,beforeDifferentPixels:b.differentPixels,beforeExactAdvance:b.exactAdvance,
      beforeComplete:b.completeMatch,referenceWidthUnchanged:b.systemAdvance===r.systemAdvance,referencePixelsUnchanged:b.systemRasterSHA256===r.systemRasterSHA256,ownPixelsUnchanged:b.ownRasterSHA256===r.ownRasterSHA256,advanceUnchanged:b.ownAdvance===r.ownAdvance,beforeSelfTestPixels:b.selfTestPixels};
  });
  const stats=rs=>({total:rs.length,beforeInkError:rs.reduce((a,r)=>a+r.beforeInkError,0),afterInkError:rs.reduce((a,r)=>a+r.absoluteInkError,0),
    improved:rs.filter(r=>r.absoluteInkError<r.beforeInkError).length,unchanged:rs.filter(r=>r.absoluteInkError===r.beforeInkError).length,worse:rs.filter(r=>r.absoluteInkError>r.beforeInkError).length,
    beforeExactAdvance:rs.filter(r=>r.beforeExactAdvance).length,exactAdvance:rs.filter(r=>r.exactAdvance).length,beforeComplete:rs.filter(r=>r.beforeComplete).length,complete:rs.filter(r=>r.completeMatch).length,
    selfTestPixels:rs.reduce((a,r)=>a+r.selfTestPixels+r.beforeSelfTestPixels,0),referenceWidthChanges:rs.filter(r=>!r.referenceWidthUnchanged).length,referencePixelChanges:rs.filter(r=>!r.referencePixelsUnchanged).length,ownPixelsUnchanged:rs.filter(r=>r.ownPixelsUnchanged).length,advanceChanges:rs.filter(r=>!r.advanceUnchanged).length});
  const summary={holdout,userAgent:after.userAgent,beforeHash:before.fontHash,afterHash:after.fontHash,
    all:stats(rows),base:stats(rows.filter(r=>'Uu'.includes(r.text))),baseByWeight:weights.map(weight=>({weight,...stats(rows.filter(r=>r.weight===weight&&'Uu'.includes(r.text)))})),affectedByWeight:weights.map(weight=>({weight,...stats(rows.filter(r=>r.weight===weight&&'UuÙÚÛÜùúûüŨũŪūŬŭŮůŰűŲų'.includes(r.text)))})),
    controls:stats(rows.filter(r=>!'UuÙÚÛÜùúûüŨũŪūŬŭŮůŰűŲų'.includes(r.text))),affected:rows.filter(r=>'UuÙÚÛÜùúûüŨũŪūŬŭŮůŰűŲų'.includes(r.text))};
  document.querySelector('#json').textContent=JSON.stringify({before,after},null,2);
  document.querySelector('#summary').textContent=JSON.stringify(summary,null,2);
  document.querySelector('#status').textContent=`Завершено: ${rows.length} парных сравнений; ${summary.all.exactAdvance} точных ширин, ${summary.all.complete} полных совпадений.`;
})().catch(error=>document.querySelector('#status').textContent=error.message);
</script>
</html>
